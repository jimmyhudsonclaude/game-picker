<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Picker</title>
<meta name="theme-color" content="#1b9091">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231b9091'/%3E%3Crect x='6' y='6' width='12' height='12' rx='2.5' fill='none' stroke='white' stroke-width='1.8'/%3E%3Ccircle cx='9.5' cy='9.5' r='1.3' fill='white'/%3E%3Ccircle cx='12' cy='12' r='1.3' fill='white'/%3E%3Ccircle cx='14.5' cy='14.5' r='1.3' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b9091;      /* 5211's card color */
    --fg: #ffffff;
    --soft: #146c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); transition: background-color .6s ease; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--fg);
    font-family: "Avenir Next", "Nunito Sans", "Helvetica Neue", Arial, sans-serif;
    transition: background-color .6s ease, color .6s ease;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  .ico { width: 40px; height: 40px; flex: none; border-radius: 9px; background: var(--fg); color: var(--bg);
         display: inline-flex; align-items: center; justify-content: center; transition: background-color .6s, color .6s; }
  .ico svg { width: 76%; height: 76%; }

  header { text-align: center; margin: 6px 0 18px; }
  header h1 { font-size: clamp(30px, 8vw, 40px); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  header p { opacity: .85; font-size: 16px; margin-top: 4px; font-weight: 500; }

  /* ---------- filters panel (styled like a card) ---------- */
  .panel { width: 100%; max-width: 440px; background: var(--soft); border-radius: 22px; padding: 18px 16px 20px;
           transition: background-color .6s; }
  .filter + .filter { margin-top: 16px; }
  .label { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; margin-bottom: 10px; }
  .label .hint { margin-left: auto; font-weight: 500; font-size: 13px; opacity: .75; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { min-width: 44px; height: 40px; padding: 0 13px; border-radius: 10px; font-weight: 700; font-size: 15px;
          background: rgba(255,255,255,.14); border: 2px solid transparent; transition: background-color .15s, color .15s; }
  .chip:hover { background: rgba(255,255,255,.24); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  .count { text-align: center; margin: 18px 0 12px; font-weight: 600; font-size: 15px; opacity: .9; min-height: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
         height: 54px; padding: 0 26px; border-radius: 14px; font-weight: 800; font-size: 18px;
         background: var(--fg); color: var(--bg); box-shadow: 0 4px 14px rgba(0,0,0,.18);
         transition: transform .1s, background-color .6s, color .6s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--fg); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .pull { width: 100%; max-width: 440px; }

  /* ---------- result ---------- */
  #picker { width: 100%; display: flex; flex-direction: column; align-items: center; }
  #result { display: none; flex-direction: column; align-items: center; width: 100%; }
  body.showing #result { display: flex; }
  html:has(body.showing), body.showing { background: var(--soft); }
  body.showing #sub { display: none; }
  body.showing #picker { display: none; }
  .meta { font-size: 14px; font-weight: 600; opacity: .85; margin-bottom: 12px; text-align: center; }

  .flip { width: min(360px, 86vw); aspect-ratio: 5 / 7; perspective: 1400px; cursor: pointer; container-type: inline-size; }
  .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
           transition: transform .8s cubic-bezier(.45,.05,.2,1); }
  .flip.flipped .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          border-radius: 6cqw; background: var(--bg); color: var(--fg); overflow: hidden;
          box-shadow: 0 14px 40px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.12) inset;
          display: flex; flex-direction: column; }
  .back { transform: rotateY(180deg); padding: 6cqw 6.5cqw; }
  .lift { animation: lift .8s cubic-bezier(.45,.05,.2,1); }
  @keyframes lift { 0% { transform: none; } 45% { transform: scale(1.1) translateY(-10px); } 100% { transform: none; } }
  .flip .face { transition: box-shadow .8s; }
  .flip.lifting .face { box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .deal { animation: deal .55s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes deal { from { transform: translateY(40px) rotate(-7deg) scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }

  .front { padding: 4.5cqw 4.5cqw 3cqw; }
  .stats { display: grid; grid-template-columns: 11cqw 1.25fr 11cqw 1.25fr 11cqw 1fr; align-items: center;
           gap: 1.6cqw; font-weight: 700; font-size: 5.2cqw; text-align: center; white-space: nowrap; margin-bottom: 3.5cqw; }
  .stats .ico, .row .ico { width: 11cqw; height: 11cqw; border-radius: 2.4cqw; }
  .art { flex: 1; min-height: 0; border-radius: 2.5cqw; background: var(--soft);
         display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .art img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; opacity: 0; transition: opacity .35s; }
  .art img.loaded { opacity: 1; }
  .art .fallback { font-weight: 800; font-size: 9cqw; text-align: center; padding: 8cqw; line-height: 1.1; }
  .name { text-align: center; font-weight: 700; line-height: 1.15; padding-top: 3cqw; min-height: 15cqw;
          display: flex; align-items: center; justify-content: center; }

  .title { text-align: center; font-weight: 700; line-height: 1.15; margin-bottom: 5cqw; }
  .row { display: flex; align-items: center; gap: 4cqw; margin-bottom: 3cqw; font-size: 4.6cqw; font-weight: 600; line-height: 1.2; }
  .row .ico { width: 13cqw; height: 13cqw; }
  .blurb { margin-top: 4cqw; line-height: 1.4; font-size: 4.7cqw; font-weight: 500; }
  .bgg { margin-top: auto; text-align: center; font-size: 3.8cqw; font-weight: 700; color: var(--fg); opacity: .85; }

  .tap { font-size: 13px; opacity: .75; margin: 12px 0 16px; font-weight: 600; }
  .actions { display: flex; gap: 10px; width: min(360px, 86vw); }
  .actions .btn { flex: 1; padding: 0 12px; }

  .pull + .pull { margin-top: 10px; }
  #list { display: none; width: 100%; max-width: 520px; flex-direction: column; }
  body.listing #list { display: flex; }
  body.listing #picker, body.listing #sub { display: none; }
  .listhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .listhead .btn { height: 42px; padding: 0 16px; font-size: 15px; }
  .listhead .what { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .listhead .what small { display: block; font-weight: 500; font-size: 13px; opacity: .8; }
  .games { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .games button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
                  padding: 8px 12px 8px 8px; border-radius: 14px; background: var(--soft);
                  transition: transform .1s, filter .15s; }
  .games button:hover { filter: brightness(1.08); }
  .games button:active { transform: scale(.985); }
  .games button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .thumb { width: 52px; height: 52px; flex: none; border-radius: 9px; overflow: hidden;
           display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gname { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .gstats { font-size: 13px; font-weight: 600; opacity: .8; margin-top: 3px; }
  .chev { margin-left: auto; opacity: .6; font-weight: 700; font-size: 18px; }
  .empty { text-align: center; max-width: 360px; margin-top: 4px; font-weight: 600; line-height: 1.4; }
  footer { margin-top: auto; padding-top: 28px; font-size: 12px; opacity: .7; text-align: center; }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .deal, html, body { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <header>
    <h1>What are we playing?</h1>
    <p id="sub">Pick a few filters, or leave them blank.</p>
  </header>

  <section id="picker">
    <div class="panel">
      <div class="filter">
        <div class="label"><span class="ico" data-icon="people"></span>Players<span class="hint">tap again to clear</span></div>
        <div class="chips" id="players"></div>
      </div>
      <div class="filter">
        <div class="label"><span class="ico" data-icon="clock"></span>Time limit</div>
        <div class="chips" id="time"></div>
      </div>
      <div class="filter">
        <div class="label"><span class="ico" data-icon="weight"></span>Weight</div>
        <div class="chips" id="weight"></div>
      </div>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
    <button class="btn pull" id="pull">Pull a game</button>
    <button class="btn ghost pull" id="seeall">See all matches</button>
  </section>

  <section id="list">
    <div class="listhead">
      <button class="btn ghost" id="listback">Back</button>
      <div class="what" id="listwhat"></div>
    </div>
    <ul class="games" id="games"></ul>
  </section>

  <section id="result">
    <div class="meta" id="meta"></div>
    <div class="flip" id="card" role="button" tabindex="0" aria-label="Flip card">
      <div class="inner">
        <div class="face front">
          <div class="stats">
            <span class="ico" data-icon="people"></span><span id="fp"></span>
            <span class="ico" data-icon="clock"></span><span id="ft"></span>
            <span class="ico" data-icon="weight"></span><span id="fw"></span>
          </div>
          <div class="art" id="art"></div>
          <div class="name" id="fname"></div>
        </div>
        <div class="face back">
          <div class="title" id="bname"></div>
          <div class="row"><span class="ico" data-icon="theme"></span><span id="bth"></span></div>
          <div class="row"><span class="ico" data-icon="die"></span><span id="bty"></span></div>
          <div class="row"><span class="ico" data-icon="gear"></span><span id="bm"></span></div>
          <p class="blurb" id="bb"></p>
          <a class="bgg" id="bgg" target="_blank" rel="noopener">View on BoardGameGeek</a>
        </div>
      </div>
    </div>
    <div class="tap">Tap the card to flip it</div>
    <div class="actions">
      <button class="btn" id="again">Pull again</button>
      <button class="btn ghost" id="change">Filters</button>
    </div>
  </section>

  <footer>Game data and cover art from <a href="https://boardgamegeek.com" target="_blank" rel="noopener">BoardGameGeek</a></footer>

<script src="games.js"></script>
<script>
const ICONS = {
  people: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="16.3" cy="7.6" r="2.8"/><path d="M11.6 19.5c0-3.4 2.1-5.8 4.7-5.8s5.7 2.4 5.7 5.8z"/><circle cx="8.6" cy="8.4" r="3.3"/><path d="M2 20.5c0-3.9 2.9-6.5 6.6-6.5s6.6 2.6 6.6 6.5z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  weight: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="10.8" width="10" height="2.4"/><rect x="3.6" y="6" width="3.6" height="12" rx="1"/><rect x="16.8" y="6" width="3.6" height="12" rx="1"/><rect x="1" y="8.5" width="2.4" height="7" rx=".8"/><rect x="20.6" y="8.5" width="2.4" height="7" rx=".8"/></svg>',
  theme: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 19h18L15 8l-3.5 6-2.5-3z"/><circle cx="7" cy="6" r="2"/></svg>',
  die: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><g fill="currentColor"><circle cx="8.3" cy="8.3" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="15.7" cy="15.7" r="1.6"/></g></svg>',
  gear: '<svg viewBox="0 0 24 24"><g fill="currentColor">' +
        [0,45,90,135,180,225,270,315].map(a => `<rect x="10.2" y="1.8" width="3.6" height="4.4" rx=".8" transform="rotate(${a} 12 12)"/>`).join('') +
        '</g><circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="3"/></svg>'
};
document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICONS[el.dataset.icon]);

const HOME = { bg: '#1b9091', fg: '#ffffff', soft: '#146c6c' };
const $ = id => document.getElementById(id);

// ---------- filters ----------
const OPTIONS = {
  players: [1,2,3,4,5,6,7,8,9].map(n => ({ v: n, label: n === 9 ? '9+' : String(n) })),
  time: [15,30,45,60,90,120].map(n => ({ v: n, label: n === 120 ? '2 hr' : n + ' min' })),
  weight: [{ v: 'light', label: 'Light' }, { v: 'medium', label: 'Medium' }, { v: 'heavy', label: 'Heavy' }],
};
let filters = { players: null, time: null, weight: null };
try { Object.assign(filters, JSON.parse(localStorage.getItem('gp-filters') || '{}')); } catch (e) {}

function renderChips() {
  for (const key of Object.keys(OPTIONS)) {
    $(key).innerHTML = '';
    for (const o of OPTIONS[key]) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = o.label;
      b.setAttribute('aria-pressed', filters[key] === o.v);
      b.onclick = () => {
        filters[key] = filters[key] === o.v ? null : o.v;
        try { localStorage.setItem('gp-filters', JSON.stringify(filters)); } catch (e) {}
        bag = [];
        renderChips(); updateCount();
      };
      $(key).appendChild(b);
    }
  }
}

function fits(g) {
  const [pmin, pmax] = g.p;
  if (filters.players) {
    if (!pmin && !pmax) return false;
    const lo = pmin || pmax, hi = pmax || pmin;
    if (filters.players === 9 ? hi < 9 : (filters.players < lo || filters.players > hi)) return false;
  }
  if (filters.time) {
    const shortest = g.t[0] || g.t[1];
    if (!shortest || shortest > filters.time) return false;
  }
  if (filters.weight) {
    if (!g.w) return false;
    const band = g.w < 2 ? 'light' : g.w <= 3 ? 'medium' : 'heavy';
    if (band !== filters.weight) return false;
  }
  return true;
}
const matches = () => GAMES.filter(fits);

function updateCount() {
  const n = matches().length;
  $('count').textContent = n === GAMES.length ? `All ${n} games in the pool`
                         : n === 0 ? 'No games match. Try loosening a filter.'
                         : `${n} game${n === 1 ? '' : 's'} match`;
  $('pull').disabled = n === 0;
  $('seeall').disabled = n === 0;
  $('seeall').textContent = n === GAMES.length ? 'See all games' : `See all ${n} match${n === 1 ? '' : 'es'}`;
}

// ---------- pulling ----------
let bag = [], last = null;
function draw() {
  if (!bag.length) {
    bag = matches().slice();
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    if (bag.length > 1 && bag[bag.length - 1] === last) bag.unshift(bag.pop());
  }
  return bag.pop();
}

function setTheme(c) {
  const r = document.documentElement.style;
  r.setProperty('--bg', c.bg); r.setProperty('--fg', c.fg); r.setProperty('--soft', c.soft);
  document.querySelector('meta[name=theme-color]').content = c.bg;
}

const range = (a, b) => (!a && !b) ? '?' : (!b || a === b) ? String(a || b) : `${a}-${b}`;
const size = (s, steps) => (steps.find(([n]) => s.length <= n) || steps[steps.length - 1])[1];

function show(g) {
  last = g;
  setTheme(g);
  $('fp').textContent = range(...g.p);
  $('ft').textContent = range(...g.t);
  $('fw').textContent = g.w ? g.w.toFixed(1) : '?';
  $('fname').textContent = $('bname').textContent = g.n;
  $('fname').style.fontSize = size(g.n, [[22, '6.6cqw'], [32, '5.6cqw'], [44, '4.7cqw'], [999, '4cqw']]);
  $('bname').style.fontSize = size(g.n, [[22, '7.4cqw'], [32, '6.2cqw'], [44, '5.2cqw'], [999, '4.5cqw']]);
  $('bth').textContent = g.th; $('bty').textContent = g.ty; $('bm').textContent = g.m; $('bb').textContent = g.b;
  $('bgg').href = 'https://boardgamegeek.com/boardgame/' + g.id;

  const art = $('art'); art.innerHTML = '';
  if (g.img) {
    const img = new Image();
    img.alt = g.n + ' cover';
    img.onload = () => img.classList.add('loaded');
    img.onerror = () => { art.innerHTML = ''; const d = document.createElement('div'); d.className = 'fallback'; d.textContent = g.n; art.appendChild(d); };
    img.src = g.img;
    art.appendChild(img);
  }

  const n = matches().length;
  $('meta').textContent = n === GAMES.length ? `From all ${n} games` : `1 of ${n} matching game${n === 1 ? '' : 's'}`;
  const card = $('card');
  card.classList.remove('flipped', 'deal'); void card.offsetWidth; card.classList.add('deal');
  $('again').disabled = n < 2;
  $('again').textContent = n < 2 ? 'Only match' : 'Pull again';
  document.body.classList.remove('listing');
  document.body.classList.add('showing');
  $('change').textContent = cameFrom === 'list' ? 'Back to list' : 'Filters';
  window.scrollTo(0, 0);
  // warm up the next cover so it pops in fast
  if (bag.length && bag[bag.length - 1].img) new Image().src = bag[bag.length - 1].img;
}

let cameFrom = 'picker';
function describe() {
  const bits = [];
  if (filters.players) bits.push(filters.players === 9 ? '9+ players' : filters.players + (filters.players === 1 ? ' player' : ' players'));
  if (filters.time) bits.push(filters.time === 120 ? '2 hours or less' : filters.time + ' min or less');
  if (filters.weight) bits.push(filters.weight[0].toUpperCase() + filters.weight.slice(1) + ' weight');
  return bits.length ? bits.join(' · ') : 'No filters';
}
function showList() {
  const list = matches();
  $('listwhat').innerHTML = '';
  $('listwhat').append(`${list.length} game${list.length === 1 ? '' : 's'}`);
  const sm = document.createElement('small'); sm.textContent = describe(); $('listwhat').append(sm);
  const ul = $('games'); ul.innerHTML = '';
  for (const g of list) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    const th = document.createElement('span'); th.className = 'thumb'; th.style.background = g.bg;
    if (g.tn) { const im = document.createElement('img'); im.loading = 'lazy'; im.alt = ''; im.src = g.tn;
                im.onerror = () => im.remove(); th.append(im); }
    const txt = document.createElement('span');
    const nm = document.createElement('div'); nm.className = 'gname'; nm.textContent = g.n;
    const st = document.createElement('div'); st.className = 'gstats';
    st.textContent = `${range(...g.p)} players · ${range(...g.t)} min · weight ${g.w ? g.w.toFixed(1) : '?'}`;
    txt.append(nm, st);
    const ch = document.createElement('span'); ch.className = 'chev'; ch.textContent = '›';
    b.append(th, txt, ch);
    b.onclick = () => { listScroll = window.scrollY; cameFrom = 'list'; show(g); };
    li.append(b); ul.append(li);
  }
  setTheme(HOME);
  document.body.classList.remove('showing');
  document.body.classList.add('listing');
}
let listScroll = 0;

$('seeall').onclick = () => { showList(); window.scrollTo(0, 0); };
$('listback').onclick = () => { document.body.classList.remove('listing'); window.scrollTo(0, 0); };
$('pull').onclick = () => { cameFrom = 'picker'; const g = draw(); if (g) show(g); };
$('again').onclick = () => { const g = draw(); if (g) show(g); };
$('change').onclick = () => {
  document.body.classList.remove('showing'); setTheme(HOME);
  if (cameFrom === 'list') { document.body.classList.add('listing'); window.scrollTo(0, listScroll); }
  else { document.body.classList.remove('listing'); window.scrollTo(0, 0); }
};
const flip = () => {
  const c = $('card');
  c.classList.remove('deal', 'lift'); void c.offsetWidth;
  c.classList.add('lift', 'lifting');
  c.classList.toggle('flipped');
  clearTimeout(flip.t); flip.t = setTimeout(() => c.classList.remove('lifting'), 400);
};
$('card').onclick = e => { if (!e.target.closest('a')) flip(); };
$('card').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };

renderChips(); updateCount();
</script>
</body>
</html>
